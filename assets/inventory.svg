<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 236" width="800" height="236" fill="none" role="img" aria-label="Technical stack: LANGUAGES: JavaScript · TypeScript · Python · Kotlin · SQL · HTML · CSS. FRONTEND: React · Next.js · React Native · Vite · Tailwind CSS. BACKEND: Node.js · Express.js · Flask · REST APIs · JWT / Firebase Auth. DATA + CLOUD: PostgreSQL · MySQL · Supabase · Firestore · Azure. TOOLS: Git · GitHub · VS Code · Postman · Figma · Google Apps Script. TRAINING: IBM SkillsBuild · Cisco Networking Academy">
<style>
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sway{animation:sway 1.6s steps(1) infinite}
@keyframes sway{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
