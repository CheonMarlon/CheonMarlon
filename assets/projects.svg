<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 626" width="800" height="626" fill="none" role="img" aria-label="4 projects: BRGY-AI, Seminar Attendance &amp; Feedback System, Dear Stranger, OBStellar">
<style>
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sway{animation:sway 1.6s steps(1) infinite}
@keyframes sway{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="799" height="625" rx="4" fill="#0a0a0a" stroke="#262a27"/>
<g class="rise" style="animation-delay:0.08s"><text class="m" x="28" y="40" font-size="16" fill="#33ff66" >▶</text><text class="m" x="52" y="40" font-size="16" fill="#dcdcdc" font-weight="700">01  BRGY-AI</text><text class="m" x="772" y="40" font-size="11" fill="#7c817d" letter-spacing="1.5" text-anchor="end">CAPSTONE · MID 2025 – PRESENT</text><text class="m" x="52" y="68" font-size="14" fill="#7c817d" >RAG-based legal info and dispute resolution assistant for Barangay 134. Helps</text><text class="m" x="52" y="88" font-size="14" fill="#7c817d" >officials look up legal information and draft documents, with automated PDF</text><text class="m" x="52" y="108" font-size="14" fill="#7c817d" >certificates and a bilingual (Tagalog/English) knowledge base admin. Spans a</text><text class="m" x="52" y="128" font-size="14" fill="#7c817d" >Next.js admin dashboard, an Express backend, Supabase and a React Native</text><text class="m" x="52" y="148" font-size="14" fill="#7c817d" >resident app.</text><text class="m" x="52" y="174" font-size="11" fill="#5d635e" letter-spacing="1">NEXT.JS · NODE.JS · TYPESCRIPT · EXPRESS · SUPABASE · REACT NATIVE</text><line x1="28" y1="190" x2="772" y2="190" stroke="#262a27"/></g><g class="rise" style="animation-delay:0.2s"><text class="m" x="28" y="226" font-size="16" fill="#33ff66" >▶</text><text class="m" x="52" y="226" font-size="16" fill="#dcdcdc" font-weight="700">02  Seminar Attendance &amp; Feedback System</text><text class="m" x="772" y="226" font-size="11" fill="#7c817d" letter-spacing="1.5" text-anchor="end">AUTOMATION · 2026</text><text class="m" x="52" y="254" font-size="14" fill="#7c817d" >Automated seminar workflow: attendance and feedback come in through Google</text><text class="m" x="52" y="274" font-size="14" fill="#7c817d" >Forms into Sheets, then certificates are generated and emailed, stored in</text><text class="m" x="52" y="294" font-size="14" fill="#7c817d" >Drive, and narrative reports are drafted from the collected data.</text><text class="m" x="52" y="320" font-size="11" fill="#5d635e" letter-spacing="1">GOOGLE APPS SCRIPT · FORMS · SHEETS · DRIVE · GMAIL</text><line x1="28" y1="336" x2="772" y2="336" stroke="#262a27"/></g><g class="rise" style="animation-delay:0.32s"><text class="m" x="28" y="372" font-size="16" fill="#33ff66" >▶</text><text class="m" x="52" y="372" font-size="16" fill="#dcdcdc" font-weight="700">03  Dear Stranger</text><text class="m" x="772" y="372" font-size="11" fill="#7c817d" letter-spacing="1.5" text-anchor="end">SOLE DEVELOPER · 2026</text><text class="m" x="52" y="400" font-size="14" fill="#7c817d" >Anonymous letter-sharing platform with no user accounts: submit, discover,</text><text class="m" x="52" y="420" font-size="14" fill="#7c817d" >shuffle, paginate and archive letters. Deployed on an Azure Virtual Machine</text><text class="m" x="52" y="440" font-size="14" fill="#7c817d" >for public access.</text><text class="m" x="52" y="466" font-size="11" fill="#5d635e" letter-spacing="1">HTML · CSS · JAVASCRIPT · FIREBASE FIRESTORE · AZURE VM</text><line x1="28" y1="482" x2="772" y2="482" stroke="#262a27"/></g><g class="rise" style="animation-delay:0.44s"><text class="m" x="28" y="518" font-size="16" fill="#33ff66" >▶</text><text class="m" x="52" y="518" font-size="16" fill="#dcdcdc" font-weight="700">04  OBStellar</text><text class="m" x="772" y="518" font-size="11" fill="#7c817d" letter-spacing="1.5" text-anchor="end">SOLE DEVELOPER · 2026</text><text class="m" x="52" y="546" font-size="14" fill="#7c817d" >Native Android app for viewing and exploring the coordinates of real-world</text><text class="m" x="52" y="566" font-size="14" fill="#7c817d" >constellations.</text><text class="m" x="52" y="592" font-size="11" fill="#5d635e" letter-spacing="1">KOTLIN · ANDROID</text></g>
</svg>