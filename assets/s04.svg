<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44" fill="none" role="img" aria-label="Section 04: PLAYFIELD">
<style>
.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sway{animation:sway 1.6s steps(1) infinite}
@keyframes sway{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="799" height="43" rx="4" fill="#0a0a0a" stroke="#262a27"/>

<text class="m" x="28" y="28" font-size="12" fill="#33ff66" >&gt;</text><text class="m" x="46" y="28" font-size="12" fill="#dcdcdc" letter-spacing="4">PLAYFIELD</text>
<line x1="210" y1="23" x2="772" y2="23" stroke="#262a27"/>
</svg>